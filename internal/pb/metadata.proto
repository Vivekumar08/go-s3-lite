syntax = "proto3";

package metadata;
option go_package = "internal/pb";

message NodeInfo {
  string id = 1;
  string address = 2;
}

message RegisterNodeRequest {
  NodeInfo node = 1;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message GetNodeRequest {
  string file_key = 1;
}

message GetNodeResponse {
  NodeInfo node = 1;
}

message ListNodesRequest {}
message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message GetReplicasRequest { string file_key = 1; int32 replicas = 2; }
message GetReplicasResponse { repeated NodeInfo nodes = 1; }

message HeartbeatRequest { string node_id = 1; }
message HeartbeatResponse { bool ok = 1; }

service MetadataService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc GetNodeForFile(GetNodeRequest) returns (GetNodeResponse);
  rpc GetReplicasForFile(GetReplicasRequest) returns (GetReplicasResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse); 
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

